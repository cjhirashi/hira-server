services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hira-backend
    container_name: hira-backend
    env_file: .env
    environment:
      - HIRA_DEPLOY_MODE=${HIRA_DEPLOY_MODE:-server}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - hira-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hira-frontend
    container_name: hira-frontend
    env_file: .env
    networks:
      - hira-network
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: hira-postgres
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hira}
      - POSTGRES_USER=${POSTGRES_USER:-hira}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hira-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hira} -d ${POSTGRES_DB:-hira}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: hira-redis
    env_file: .env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - hira-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: hira-mosquitto
    env_file: .env
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    entrypoint: ["/mosquitto/config/init.sh"]
    networks:
      - hira-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hira-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - hira-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  hira-network:
    driver: bridge
