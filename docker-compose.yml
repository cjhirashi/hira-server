services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hira-backend
    container_name: hira-backend
    env_file: .env
    environment:
      - HIRA_DEPLOY_MODE=${HIRA_DEPLOY_MODE:-server}
    volumes:
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - hira-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hira-frontend
    container_name: hira-frontend
    env_file: .env
    networks:
      - hira-network
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: hira-postgres
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hira}
      - POSTGRES_USER=${POSTGRES_USER:-hira}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hira-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hira} -d ${POSTGRES_DB:-hira}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: hira-redis
    env_file: .env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - hira-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: hira-mosquitto
    env_file: .env
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    entrypoint: ["sh", "/mosquitto/config/init.sh"]
    networks:
      - hira-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hira-backend
    container_name: hira-celery-worker
    command: celery -A workers.celery_app worker -Q simulators --loglevel=info
    env_file: .env
    environment:
      - HIRA_DEPLOY_MODE=${HIRA_DEPLOY_MODE:-server}
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - hira-network
    restart: unless-stopped

  celery-poller:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hira-backend
    container_name: hira-celery-poller
    command: celery -A workers.celery_app worker -Q protocols --loglevel=info
    env_file: .env
    environment:
      - HIRA_DEPLOY_MODE=${HIRA_DEPLOY_MODE:-server}
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - hira-network
    restart: unless-stopped

  celery-alarm:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hira-backend
    container_name: hira-celery-alarm
    command: celery -A workers.celery_app worker -Q normal --loglevel=info
    env_file: .env
    environment:
      - HIRA_DEPLOY_MODE=${HIRA_DEPLOY_MODE:-server}
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - hira-network
    restart: unless-stopped

  celery-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hira-backend
    container_name: hira-celery-tests
    command: celery -A workers.celery_app worker -Q high --concurrency=2 --loglevel=info
    env_file: .env
    environment:
      - HIRA_DEPLOY_MODE=${HIRA_DEPLOY_MODE:-server}
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - hira-network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hira-backend
    container_name: hira-celery-beat
    command: celery -A workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - HIRA_DEPLOY_MODE=${HIRA_DEPLOY_MODE:-server}
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - hira-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hira-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - hira-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: hira-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - hira-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: hira-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=hira_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - hira-network
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: hira-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-hira}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hira}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hira-network
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: hira-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hira-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  grafana_data:
  backups_data:

networks:
  hira-network:
    driver: bridge
