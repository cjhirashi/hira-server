# Hira — Nginx reverse proxy
# Rate limiting V-03: 100 req/s por IP para API REST, máx 10 conexiones WS por IP

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Rate limiting ──────────────────────────────────────────────────────
    # 100 requests/s por IP para endpoints REST
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    # Máximo 10 conexiones WebSocket por IP
    limit_conn_zone $binary_remote_addr zone=ws:10m;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # ── API REST → backend FastAPI ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://backend:8000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket ──────────────────────────────────────────────────────
        location /ws/ {
            limit_conn ws 10;

            proxy_pass         http://backend:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
        }

        # ── Frontend estático ──────────────────────────────────────────────
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}
