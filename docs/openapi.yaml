      parameters:
        - $ref: "#/components/parameters/ScriptId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Número máximo de entradas a retornar
      responses:
        "200":
          description: Entradas de log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptExecutionResponse"
        "404":
          description: Script no encontrado

  /v1/points/{id}/history:
    get:
      operationId: get_point_history
      summary: Histórico de valores de un punto
      description: |
        Retorna el historial de valores registrados en TimescaleDB para el punto indicado.
        Soporta datos crudos (`interval=raw`) y agregación con `time_bucket` de TimescaleDB
        (`1min`, `5min`, `1hour`, `1day`). Si `format=csv` retorna StreamingResponse con
        Content-Type `text/csv` en lugar de JSON.
      tags:
        - Historicals
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del punto
        - name: from_dt
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inicio del rango (ISO8601 UTC). Default: hace 1 hora.
        - name: to_dt
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Fin del rango (ISO8601 UTC). Default: ahora.
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum: [raw, 1min, 5min, 1hour, 1day]
            default: raw
          description: Nivel de agregación. `raw` devuelve todos los registros sin agrupar.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: Formato de respuesta.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
          description: Número máximo de registros a devolver.
      responses:
        "200":
          description: Histórico del punto (JSON o CSV según `format`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointHistoryResponse"
            text/csv:
              schema:
                type: string
                description: "Archivo CSV con columnas: timestamp,value,quality"
        "401":
          description: No autenticado
        "403":
          description: Sin permiso `historicals:read`
        "404":
          description: Punto no encontrado

