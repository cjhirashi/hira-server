              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointWriteResponse"
        "400":
          description: Punto no escribible o valor fuera de rango
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
