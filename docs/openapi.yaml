        "404":
          description: Script no encontrado

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtenido via `POST /auth/login`.
        Vida útil: 15 minutos. Renovar con `POST /auth/refresh`.

  headers:
    XTraceID:
      description: |
        Identificador único del request para trazabilidad end-to-end.
        Se propaga en todos los logs del backend con el mismo valor.
      schema:
        type: string
        format: uuid
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID numérico del usuario

    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID numérico del dispositivo

    PointId:
      name: point_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID numérico del punto

    SimulatorId:
      name: simulator_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID numérico del simulador (dispositivo con is_simulator=true)

    AreaId:
      name: area_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID numérico del área

    ScriptId:
      name: script_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID numérico del script de lógica

    TestScriptId:
      name: script_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID numérico del script de prueba

  schemas:
    # ── Monitor ──────────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      required:
        - status
        - services
        - version
        - trace_id
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Estado global del sistema
        services:
          type: object
          required:
            - postgres
            - redis
            - mosquitto
          properties:
            postgres:
              type: string
              enum: [ok, error]
            redis:
              type: string
              enum: [ok, error]
            mosquitto:
              type: string
              enum: [ok, error]
        version:
          type: string
          example: "0.1.0"
        trace_id:
          type: string
          format: uuid

    # ── Auth ─────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          example: admin@hira.local
        password:
          type: string
          minLength: 8
          description: Contraseña en texto plano (se verifica contra bcrypt)

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: JWT refresh token obtenido en el login o refresh anterior

    TokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: JWT de acceso (HS256, 15 minutos)
        refresh_token:
          type: string
          description: JWT de renovación (HS256, 7 días, almacenado en Redis)
        token_type:
          type: string
          enum: [bearer]
          example: bearer
        expires_in:
          type: integer
          description: Segundos hasta la expiración del access token
          example: 900
        user:
          $ref: "#/components/schemas/UserInToken"

    UserInToken:
      type: object
      description: Datos mínimos del usuario incluidos en la respuesta de auth
      required:
        - id
        - email
        - role
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: admin@hira.local
        full_name:
          type: string
          nullable: true
          example: "Administrador Hira"
        role:
          type: string
          description: Nombre del rol del usuario
          example: Admin

    # ── Users ─────────────────────────────────────────────────────────────────

    UserCreate:
      type: object
      required:
        - email
        - password
        - role_id
      properties:
        email:
          type: string
          format: email
          description: Email único del usuario
          example: operador@hira.local
        full_name:
          type: string
          nullable: true
          maxLength: 150
          description: Nombre completo (opcional)
          example: "Juan Pérez"
        password:
          type: string
          minLength: 8
          description: Contraseña en texto plano — se hashea con bcrypt factor 12
        role_id:
          type: integer
          minimum: 1
          description: ID del rol asignado (1=Admin, 2=Operador, 3=Visor)
          example: 2

    UserUpdate:
      type: object
      description: Todos los campos son opcionales — solo se actualizan los enviados
      properties:
        full_name:
          type: string
          nullable: true
          maxLength: 150
          example: "Juan Pérez García"
        role_id:
          type: integer
          minimum: 1
          description: Cambiar el rol invalida inmediatamente el caché RBAC del usuario.
          example: 3
        is_active:
          type: boolean
          description: Activar o desactivar la cuenta sin eliminarla
          example: true

    UserResponse:
      type: object
      required:
        - id
        - email
        - role_id
        - role_name
        - is_active
        - created_at
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: admin@hira.local
        full_name:
          type: string
          nullable: true
          example: "Administrador Hira"
        role_id:
          type: integer
          example: 1
        role_name:
          type: string
          example: Admin
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-07-25T10:00:00Z"
        last_login:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-25T12:30:00Z"

    # ── Devices ──────────────────────────────────────────────────────────────

    DeviceCreate:
      type: object
      required:
        - name
        - protocol
        - address
      properties:
        name:
          type: string
          maxLength: 255
          example: "AHU-01"
        protocol:
          type: string
          enum: [bacnet, modbus, mqtt]
          example: bacnet
        address:
          type: string
          description: IP o hostname del dispositivo
          example: "192.168.1.100"
        port:
          type: integer
          nullable: true
          description: Puerto de comunicación (default según protocolo)
          example: 47808
        config_json:
          type: object
          description: Configuración adicional específica del protocolo
          example: {"device_id": 1001, "network": 1}
        area:
          type: string
          nullable: true
          maxLength: 100
          example: "Piso 3 — Sala de máquinas"
        auto_start:
          type: boolean
          default: false
          description: Arrancar polling automáticamente al levantar el servidor

    DeviceResponse:
      type: object
      required:
        - id
        - name
        - protocol
        - address
        - status
        - is_simulator
        - auto_start
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "AHU-01"
        protocol:
          type: string
          enum: [bacnet, modbus, mqtt]
          example: bacnet
        address:
          type: string
          example: "192.168.1.100"
        port:
          type: integer
          nullable: true
          example: 47808
        config_json:
          type: object
          nullable: true
          example: {"device_id": 1001}
        area:
          type: string
          nullable: true
          example: "Piso 3"
        status:
          type: string
          enum: [online, offline, unknown, error]
          example: online
        is_simulator:
          type: boolean
          example: false
        auto_start:
          type: boolean
          example: false

    DeviceScanResult:
      type: object
      required:
        - discovered
        - scan_duration_ms
      properties:
        discovered:
          type: array
          items:
            $ref: "#/components/schemas/DeviceResponse"
        scan_duration_ms:
          type: integer
          description: Duración total del escaneo en milisegundos
          example: 3200

    # ── Points ────────────────────────────────────────────────────────────────

    PointValue:
      type: object
      required:
        - id
        - name
        - value
        - quality
        - timestamp
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: "Temperatura impulsión"
        value:
          description: Valor actual del punto (número, booleano o string según tipo)
          example: 22.5
        unit:
          type: string
          nullable: true
          example: "°C"
        quality:
          type: string
          enum: [good, bad, uncertain, offline]
          example: good
        timestamp:
          type: string
          format: date-time
          example: "2026-07-25T10:00:00Z"

    PointWriteRequest:
      type: object
      required:
        - value
      properties:
        value:
          description: Valor a escribir en el punto
          example: 21.0

    PointWriteResponse:
      type: object
      required:
        - success
        - value
        - timestamp
      properties:
        success:
          type: boolean
          example: true
        value:
          description: Valor confirmado tras la escritura
          example: 21.0
        timestamp:
          type: string
          format: date-time
          example: "2026-07-25T10:01:00Z"

    # ── Simulators ────────────────────────────────────────────────────────────

    SimulatorCreate:
      type: object
      required:
        - name
        - protocol
      properties:
        name:
          type: string
          maxLength: 255
          example: "SIM-BACnet-01"
        protocol:
          type: string
          enum: [bacnet, modbus, mqtt]
          example: bacnet
        config_json:
          type: object
          description: |
            Configuración del simulador según protocolo.
            BACnet: `{device_id, points: [{name, object_type, value_range}]}`
            Modbus: `{port, registers: [{address, value_range}]}`
            MQTT: `{topics: [{path, interval_s, value_range}]}`
          example:
            device_id: 9001
            points:
              - name: "temp_supply"
                object_type: "analogInput"
                value_range: [18.0, 26.0]

    SimulatorResponse:
      type: object
      required:
        - id
        - name
        - protocol
        - status
        - is_simulator
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "SIM-BACnet-01"
        protocol:
          type: string
          enum: [bacnet, modbus, mqtt]
          example: bacnet
        status:
          type: string
          enum: [running, stopped, error, unknown]
          example: stopped
        is_simulator:
          type: boolean
          example: true
        config_json:
          type: object
          nullable: true
          example: {"device_id": 9001}
        celery_task_id:
          type: string
          nullable: true
          description: ID de la tarea Celery activa (null si detenido)

    # ── Alarms ────────────────────────────────────────────────────────────────

    AlarmDefinitionCreate:
      type: object
      required:
        - point_id
        - name
        - condition
        - threshold
        - priority
        - message
      properties:
        point_id:
          type: integer
          example: 3
        name:
          type: string
          example: "Temperatura alta"
        condition:
          type: string
          enum: [gt, lt, eq, between]
          example: gt
        threshold:
          type: number
          format: float
          example: 28.0
        threshold_high:
          type: number
          format: float
          nullable: true
          description: Solo para condición "between"
          example: null
        priority:
          type: string
          enum: [critical, high, medium, low]
          example: high
        message:
          type: string
          example: "Temperatura de retorno supera 28°C"
        enabled:
          type: boolean
          default: true

    AlarmDefinitionResponse:
      type: object
      properties:
        id:
          type: integer
        point_id:
          type: integer
        name:
          type: string
        condition:
          type: string
          enum: [gt, lt, eq, between]
        threshold:
          type: number
        threshold_high:
          type: number
          nullable: true
        priority:
          type: string
          enum: [critical, high, medium, low]
        message:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    AlarmEventResponse:
      type: object
      properties:
        id:
          type: integer
        alarm_definition_id:
          type: integer
        point_id:
          type: integer
        point_name:
          type: string
        triggered_value:
          type: number
        priority:
          type: string
          enum: [critical, high, medium, low]
        message:
          type: string
        status:
          type: string
          enum: [active, acknowledged, resolved]
        triggered_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        acknowledged_by:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true

    # ── Shared ────────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      required:
        - error
        - trace_id
      properties:
        error:
          type: string
          description: Descripción del error
        trace_id:
          type: string
          format: uuid
          description: Trace ID del request para correlación con logs

    # ── Configurator ─────────────────────────────────────────────────────────

    AreaCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: "Piso 3 — Sala de máquinas"
        description:
          type: string
          maxLength: 500
          default: ""
          example: "Zona de equipos mecánicos en el tercer piso"

    AreaResponse:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Piso 3 — Sala de máquinas"
        description:
          type: string
          example: "Zona de equipos mecánicos en el tercer piso"
        created_at:
          type: string
          format: date-time
          example: "2026-07-25T10:00:00Z"

    PointCreate:
      type: object
      required:
        - device_id
        - name
        - object_type
        - address
      properties:
        device_id:
          type: integer
          minimum: 1
          description: ID del dispositivo al que pertenece el punto
          example: 1
        name:
          type: string
          maxLength: 255
          example: "Temperatura impulsión"
        description:
          type: string
          maxLength: 500
          default: ""
          example: "Sensor de temperatura en conducto de impulsión"
        object_type:
          type: string
          maxLength: 100
          example: "analogInput"
        address:
          type: string
          maxLength: 255
          description: Dirección del objeto según protocolo (ej. "AI:0", "400001")
          example: "AI:0"
        unit:
          type: string
          maxLength: 50
          default: ""
          example: "°C"
        writable:
          type: boolean
          default: false
        log_enabled:
          type: boolean
          default: false
        history_interval_seconds:
          type: integer
          minimum: 1
          default: 60
          description: Intervalo mínimo entre registros históricos en segundos
        area_id:
          type: integer
          nullable: true
          description: ID del área a la que pertenece el punto (opcional)
          example: 1

    PointUpdate:
      type: object
      description: Todos los campos son opcionales — solo se actualizan los enviados
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 500
        unit:
          type: string
          maxLength: 50
        writable:
          type: boolean
        log_enabled:
          type: boolean
        history_interval_seconds:
          type: integer
          minimum: 1
        area_id:
          type: integer
          nullable: true

    PointResponse:
      type: object
      required:
        - id
        - device_id
        - name
        - object_type
        - address
        - writable
        - log_enabled
        - history_interval_seconds
      properties:
        id:
          type: integer
          example: 42
        device_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Temperatura impulsión"
        description:
          type: string
          example: "Sensor de temperatura en conducto de impulsión"
        object_type:
          type: string
          example: "analogInput"
        address:
          type: string
          example: "AI:0"
        unit:
          type: string
          example: "°C"
        writable:
          type: boolean
          example: false
        log_enabled:
          type: boolean
          example: false
        history_interval_seconds:
          type: integer
          example: 60
        area_id:
          type: integer
          nullable: true
          example: 1
        area_name:
          type: string
          nullable: true
          example: "Piso 3 — Sala de máquinas"

    PointHistoryRecord:
      type: object
      required:
        - timestamp
        - value
        - quality
      properties:
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo UTC del registro
        value:
          type: number
          format: double
          description: Valor registrado del punto
        quality:
          type: string
          enum: [good, bad, uncertain]
          description: Calidad del valor en el momento del registro

    PointHistoryResponse:
      type: object
      required:
        - point_id
        - point_name
        - from_dt
        - to_dt
        - interval
        - records
        - count
      properties:
        point_id:
          type: integer
        point_name:
          type: string
        unit:
          type: string
          nullable: true
        from_dt:
          type: string
          format: date-time
        to_dt:
          type: string
          format: date-time
        interval:
          type: string
          enum: [raw, 1min, 5min, 1hour, 1day]
        records:
          type: array
          items:
            $ref: "#/components/schemas/PointHistoryRecord"
        count:
          type: integer
          description: Número total de registros en la respuesta

    LogicScriptCreate:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          maxLength: 100
          example: "Control temperatura AHU"
        description:
          type: string
          nullable: true
          example: "Ajusta setpoint según temperatura exterior"
        code:
          type: string
          example: "valor = hira.read('temp_supply')\nhira.log(f'Temperatura: {valor}')"
        interval_seconds:
          type: integer
          minimum: 1
          default: 10
          example: 10

    LogicScriptUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          nullable: true
        description:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        interval_seconds:
          type: integer
          minimum: 1
          nullable: true

    LogicScriptResponse:
      type: object
      required:
        - id
        - name
        - code
        - interval_seconds
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Control temperatura AHU"
        description:
          type: string
          nullable: true
        code:
          type: string
        interval_seconds:
          type: integer
          example: 10
        status:
          type: string
          enum: [stopped, running, error]
          example: "stopped"
        celery_task_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScriptExecutionResponse:
      type: object
      required:
        - id
        - script_id
        - started_at
        - status
      properties:
        id:
          type: integer
        script_id:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [success, error]
        output:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true

    # ── Tests ─────────────────────────────────────────────────────────────────

    TestScriptCreate:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          maxLength: 100
          example: "Prueba setpoint AHU-01"
        description:
          type: string
          nullable: true
        code:
          type: string
          example: "hira.write('setpoint', 22.0)\nval = hira.read('setpoint')\nhira.assert_equal('setpoint', 22.0)"

    TestScriptUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          nullable: true
        description:
          type: string
          nullable: true
        code:
          type: string
          nullable: true

    TestScriptResponse:
      type: object
      required:
        - id
        - name
        - code
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        code:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TestExecutionResponse:
      type: object
      required:
        - id
        - script_id
        - started_at
        - status
      properties:
        id:
          type: integer
        script_id:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, success, failure, error]
        output:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        passed:
          type: integer
          description: Número de assertions que pasaron
          nullable: true
        failed:
          type: integer
          description: Número de assertions que fallaron
          nullable: true

    TestLogEntry:
      type: object
      required:
        - id
        - level
        - message
        - created_at
      properties:
        id:
          type: integer
        level:
          type: string
          enum: [info, pass, fail, error]
        message:
          type: string
        created_at:
          type: string
          format: date-time

    TestExecutionDetail:
      allOf:
        - $ref: "#/components/schemas/TestExecutionResponse"
        - type: object
          properties:
            logs:
              type: array
              items:
                $ref: "#/components/schemas/TestLogEntry"

    # ── Analysis ──────────────────────────────────────────────────────────────

    ChartDataPoint:
      type: object
      required: [timestamp, point_name, value]
      properties:
        timestamp:
          type: string
          format: date-time
        point_name:
          type: string
        value:
          type: number

    ExecutionCompareRow:
      type: object
      required: [execution_id, started_at, points]
      properties:
        execution_id:
          type: integer
        started_at:
          type: string
          format: date-time
        points:
          type: array
          items:
            type: object
            properties:
              t_offset_ms:
                type: integer
              point_name:
                type: string
              value:
                type: number

    ScriptTrendRow:
      type: object
      required: [execution_id, started_at, status]
      properties:
        execution_id:
          type: integer
        started_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [running, success, failure, error]
        duration_ms:
          type: integer
          nullable: true
        result_summary:
          type: string
          nullable: true

    DocumentSummary:
      type: object
      required: [id, title, type, generated_at, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
          enum: [auto_script, auto_inventory, manual]
        source_type:
          type: string
          nullable: true
        source_id:
          type: integer
          nullable: true
        generated_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentResponse:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          required: [content_markdown]
          properties:
            content_markdown:
              type: string

    DocumentCreate:
      type: object
      required: [title, content_markdown]
      properties:
        title:
          type: string
          maxLength: 255
        content_markdown:
          type: string

  /ai/config:
    get:
      operationId: get_ai_config
      summary: Obtener configuración del agente
      tags: [AI]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Configuración actual (sin API key en claro)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: update_ai_config
      summary: Guardar configuración del agente y API key
      tags: [AI]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIConfigUpdate"
      responses:
        "200":
          description: Configuración guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ai/config/api-key:
    delete:
      operationId: delete_ai_api_key
      summary: Eliminar la API key guardada
      tags: [AI]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: API key eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ai/chat:
    post:
      operationId: ai_chat
      summary: Enviar mensaje al agente del integrador
      tags: [AI]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIChatRequest"
      responses:
        "200":
          description: Respuesta del agente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatResponse"
        "422":
          description: API key no configurada
        "504":
          description: Timeout del agente (30s)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ai/integrador/chat:
    post:
      operationId: ai_integrador_chat
      summary: Enviar mensaje al agente del integrador (Admin)
      tags: [AI]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIChatRequest"
      responses:
        "200":
          description: Respuesta del agente integrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatResponse"
        "422":
          description: API key no configurada
        "504":
          description: Timeout del agente (30s)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ai/cliente/chat:
    post:
      operationId: ai_cliente_chat
      summary: Enviar mensaje al agente del cliente (Admin + Operador)
      description: |
        Agente de solo lectura + reconocimiento de alarmas. No puede
        modificar configuración ni generar scripts. Accesible para
        roles Admin y Operador.
      tags: [AI]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIChatRequest"
      responses:
        "200":
          description: Respuesta del agente cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatResponse"
        "422":
          description: API key no configurada
        "504":
          description: Timeout del agente (30s)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/mode:
    get:
      operationId: system_get_mode
      summary: Modo de despliegue del servidor
      description: |
        Devuelve el modo de despliegue actual (`server` o `studio`),
        el tipo de base de datos y la versión del servidor.
        Endpoint público — no requiere autenticación.
      tags: [Monitor]
      responses:
        "200":
          description: Modo de despliegue
          content:
            application/json:
              schema:
                type: object
                required: [mode, db_type, version]
                properties:
                  mode:
                    type: string
                    enum: [server, studio]
                    description: Modo de despliegue activo
                  db_type:
                    type: string
                    enum: [postgresql, sqlite]
                    description: Tipo de base de datos en uso
                  version:
                    type: string
                    example: "0.10"

  /system/health/detailed:
    get:
      operationId: system_get_health_detailed
      summary: Métricas detalladas del sistema por componente
      tags: [Monitor]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Estado detallado de todos los componentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealthDetailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /notifications/rules:
    get:
      operationId: notifications_list_rules
      summary: Listar reglas de notificación
      tags: [Notifications]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de reglas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: notifications_create_rule
      summary: Crear regla de notificación (Admin)
      tags: [Notifications]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, channel, destination]
              properties:
                event_type:
                  type: string
                  enum: [device_offline, worker_down, disk_full, alarm_flood, backup_failed]
                channel:
                  type: string
                  enum: [email, webhook]
                destination:
                  type: string
                threshold_minutes:
                  type: integer
                  default: 5
                enabled:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Regla creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "422":
          description: Validación fallida
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /notifications/rules/{id}:
    patch:
      operationId: notifications_patch_rule
      summary: Activar/desactivar regla (Admin)
      tags: [Notifications]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Regla actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    delete:
      operationId: notifications_delete_rule
      summary: Eliminar regla (Admin)
      tags: [Notifications]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Regla eliminada
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /notifications/events:
    get:
      operationId: notifications_list_events
      summary: Historial de eventos del sistema (paginado)
      tags: [Notifications]
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, warning, info]
      responses:
        "200":
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /notifications/events/{id}/resolve:
    patch:
      operationId: notifications_resolve_event
      summary: Marcar evento como resuelto (Admin)
      tags: [Notifications]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evento resuelto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemEvent"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ai/integrador/usage:
    get:
      operationId: ai_integrador_usage
      summary: Uso de tokens del agente integrador (Admin)
      tags: [AI]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Uso de tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ai/cliente/usage:
    get:
      operationId: ai_cliente_usage
      summary: Uso de tokens del agente cliente (Admin + Operador)
      tags: [AI]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Uso de tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/crash-report:
    post:
      operationId: system_crash_report
      summary: Reporte interno de crash (uso interno del exception handler)
      tags: [Monitor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Reporte recibido

    AIConfigResponse:
      type: object
      required:
        - provider
        - model
        - has_api_key
      properties:
        provider:
          type: string
          enum: [claude, openai]
        model:
          type: string
        has_api_key:
          type: boolean
        updated_at:
          type: string
          format: date-time
          nullable: true

    AIConfigUpdate:
      type: object
      required:
        - provider
        - model
        - api_key
      properties:
        provider:
          type: string
          enum: [claude, openai]
        model:
          type: string
        api_key:
          type: string

    AIChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        session_id:
          type: string
          nullable: true

    AIChatResponse:
      type: object
      required:
        - reply
      properties:
        reply:
          type: string
        tool_calls:
          type: array
          items:
            type: object
          nullable: true

    NotificationRule:
      type: object
      required: [id, event_type, channel, destination, threshold_minutes, enabled, created_at]
      properties:
        id:
          type: integer
        event_type:
          type: string
          enum: [device_offline, worker_down, disk_full, alarm_flood, backup_failed]
        channel:
          type: string
          enum: [email, webhook]
        destination:
          type: string
        threshold_minutes:
          type: integer
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true

    SystemEvent:
      type: object
      required: [id, event_type, severity, message, notified, created_at]
      properties:
        id:
          type: integer
        event_type:
          type: string
          enum: [device_offline, worker_down, disk_full, alarm_flood, backup_failed]
        severity:
          type: string
          enum: [critical, warning, info]
        message:
          type: string
        metadata:
          type: object
          nullable: true
        notified:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true

    SystemHealthDetailed:
      type: object
      required: [status, timestamp, components]
      properties:
        status:
          type: string
          enum: [healthy, degraded, critical]
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          properties:
            database:
              type: object
            redis:
              type: object
            celery:
              type: object
            disk:
              type: object
            devices:
              type: object

    AIUsage:
      type: object
      required: [agent_type, total_tokens, estimated_cost_usd, period_days]
      properties:
        agent_type:
          type: string
          enum: [integrador, cliente]
        total_tokens:
          type: integer
        estimated_cost_usd:
          type: number
        period_days:
          type: integer
