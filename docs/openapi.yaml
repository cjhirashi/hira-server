      tags:
        - Logic
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogicScriptResponse"
        "401":
          description: No autenticado
        "403":
          description: Sin permiso logic:read

    post:
      operationId: create_logic_script
      summary: Crear script de lógica
      description: |
        Crea un nuevo script Python. Valida sintaxis antes de guardar —
        retorna 422 si el código contiene errores de sintaxis.
      tags:
        - Logic
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogicScriptCreate"
      responses:
        "201":
          description: Script creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogicScriptResponse"
        "422":
          description: Error de sintaxis en el código Python
        "401":
          description: No autenticado
        "403":
          description: Sin permiso logic:write

  /logic/scripts/{script_id}:
    get:
      operationId: get_logic_script
      summary: Detalle de script
      tags:
        - Logic
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScriptId"
      responses:
        "200":
          description: Detalle del script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogicScriptResponse"
        "404":
          description: Script no encontrado

    put:
      operationId: update_logic_script
      summary: Editar script (solo si está detenido)
      tags:
        - Logic
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScriptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogicScriptUpdate"
      responses:
        "200":
          description: Script actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogicScriptResponse"
        "409":
          description: El script está en ejecución — detenerlo antes de editar
        "422":
          description: Error de sintaxis en el código Python

    delete:
      operationId: delete_logic_script
      summary: Eliminar script (solo si está detenido)
      tags:
        - Logic
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScriptId"
      responses:
