openapi: 3.1.0

info:
  title: Hira API
  version: 0.2.0
  description: |
    API de Hira — plataforma SCADA para integradores de automatización de edificios.

    ## Contract-First
    Este archivo es el contrato de la API. Se define **antes** de implementar
    cualquier router. Los endpoints de cada sprint se añaden aquí al inicio
    del sprint, antes de escribir código.

    ## Trace ID
    Todos los requests devuelven el header `X-Trace-ID`. Si el cliente lo envía
    en el request, se reutiliza; si no, se genera un UUID nuevo. Todos los logs
    del backend incluyen el mismo `trace_id` para trazabilidad end-to-end.

    ## Autenticación
    Los endpoints protegidos requieren JWT Bearer token en `Authorization`.
    El token se obtiene via `POST /auth/login` (15 min). Se renueva con
    `POST /auth/refresh` usando el refresh token (7 días, almacenado en Redis).

servers:
  - url: /api
    description: API (vía Nginx reverse proxy)
  - url: http://localhost:8000
    description: Backend directo (desarrollo)

tags:
  - name: Monitor
    description: Estado del sistema y healthchecks
  - name: Auth
    description: Autenticación — login, refresh, logout
  - name: Users
    description: Gestión de usuarios y roles
  - name: Devices
    description: Dispositivos industriales — registro, escaneo, configuración
  - name: Points
    description: Puntos de datos — lectura y escritura de valores
  - name: Simulators
    description: Simuladores de dispositivos para desarrollo sin hardware real
  - name: Alarms
    description: Definiciones de condiciones de alarma y eventos — ciclo de vida activo/reconocido/resuelto
  - name: Historicals
    description: Históricos de valores de puntos — consulta con agregación TimescaleDB y exportación CSV
  - name: Configurator
    description: CRUD de áreas, dispositivos, puntos y usuarios desde la UI del Configurador. Requiere permiso `config:write`.
  - name: AI
    description: Agente del Integrador — chat con LLM, tools del sistema, configuración de proveedor y API key.
  - name: Notifications
    description: Reglas de notificación por email/webhook y historial de eventos del sistema.
  - name: Tests
    description: Motor de Pruebas Funcionales — scripts Python con sandbox, ejecuciones y logs.
  - name: Analysis
    description: Análisis de ejecuciones de prueba e históricos de puntos — gráficas y reportes PDF.
  - name: Documentation
    description: Módulo de documentación — generación automática desde AST de scripts Python e inventario del proyecto, más documentos manuales.

paths:
  /health:
    get:
      operationId: get_health
      summary: Estado del sistema
      description: |
        Verifica la conectividad con todos los servicios dependientes
        (PostgreSQL, Redis, Mosquitto). Endpoint público — no requiere autenticación.
      tags:
        - Monitor
      responses:
        "200":
          description: Todos los servicios operativos
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                services:
                  postgres: ok
                  redis: ok
                  mosquitto: ok
                version: 0.1.0
                trace_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        "503":
          description: Uno o más servicios no disponibles
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: degraded
                services:
                  postgres: ok
                  redis: error
                  mosquitto: ok
                version: 0.1.0
                trace_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

  /auth/login:
    post:
      operationId: auth_login
      summary: Iniciar sesión
      description: |
        Autentica con email y contraseña. Devuelve un access token (JWT HS256,
        15 min) y un refresh token (JWT HS256, 7 días, almacenado en Redis).
        No requiere autenticación previa.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: admin@hira.local
              password: "SecurePassword123!"
      responses:
        "200":
          description: Login exitoso
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Credenciales inválidas
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Credenciales inválidas"
                trace_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        "422":
          description: Cuerpo del request inválido
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: auth_refresh
      summary: Renovar access token
      description: |
        Intercambia un refresh token válido por un nuevo par de tokens
        (access + refresh). El refresh token anterior queda invalidado en Redis
        (rotación de tokens). No requiere Bearer token en Authorization.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Tokens renovados
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh token inválido o expirado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Refresh token inválido o expirado"
                trace_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

  /auth/logout:
    post:
      operationId: auth_logout
      summary: Cerrar sesión
      description: |
        Invalida el refresh token en Redis. El access token sigue válido hasta
        su expiración natural (15 min) — el cliente debe descartarlo localmente.
        Requiere Bearer token válido.
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Sesión cerrada correctamente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Sesión cerrada"
        "401":
          description: Token no válido o expirado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: list_users
      summary: Listar usuarios
      description: |
        Devuelve la lista paginada de usuarios del sistema.
        Requiere permiso `users:read` (rol Admin u Operador).
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Número de registros a omitir (paginación)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Número máximo de registros a devolver
      responses:
        "200":
          description: Lista de usuarios
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Permiso requerido: users:read"
                trace_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    post:
      operationId: create_user
      summary: Crear usuario
      description: |
        Crea un nuevo usuario. La contraseña se almacena como hash bcrypt
        (factor 12). Requiere permiso `users:write` (rol Admin).
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
            example:
              email: operador@hira.local
              full_name: "Juan Pérez"
              password: "SeguraPass456!"
              role_id: 2
      responses:
        "201":
          description: Usuario creado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Email ya registrado u otro error de validación
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "El email ya está registrado"
                trace_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Cuerpo del request inválido
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{user_id}:
    get:
      operationId: get_user
      summary: Obtener usuario por ID
      description: |
        Devuelve datos de un usuario específico.
        Requiere permiso `users:read`. Un usuario puede ver su propio perfil
        sin importar su rol.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Datos del usuario
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: update_user
      summary: Actualizar usuario
      description: |
        Actualiza campos del usuario (nombre, rol, activo). Si se cambia el rol,
        el caché RBAC del usuario se invalida inmediatamente en Redis.
        Requiere permiso `users:write` (rol Admin).
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuario actualizado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: delete_user
      summary: Desactivar usuario
      description: |
        Marca al usuario como inactivo (soft delete — no se elimina de la BD).
        Invalida el caché RBAC. Requiere permiso `users:write` (rol Admin).
        Un Admin no puede desactivarse a sí mismo.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Usuario desactivado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Usuario desactivado"
        "400":
          description: Operación inválida (e.g. auto-desactivación)
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /devices:
    get:
      operationId: list_devices
      summary: Listar dispositivos
      description: Lista todos los dispositivos registrados. Requiere `devices:read`.
      tags:
        - Devices
      security:
        - BearerAuth: []
      parameters:
        - name: protocol
          in: query
          schema:
            type: string
            enum: [bacnet, modbus, mqtt]
          description: Filtrar por protocolo
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, unknown, error]
          description: Filtrar por estado
      responses:
        "200":
          description: Lista de dispositivos
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceResponse"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: create_device
      summary: Registrar dispositivo manualmente
      description: Crea un dispositivo sin escaneo. Requiere `devices:write`.
      tags:
        - Devices
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: Dispositivo creado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          description: Datos inválidos
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /devices/scan:
    post:
      operationId: scan_devices
      summary: Escanear red en busca de dispositivos
      description: |
        Dispara un escaneo de red según el protocolo indicado.
        BACnet → Who-Is broadcast. MQTT → suscripción wildcard `#` durante N segundos.
        Los dispositivos descubiertos se registran automáticamente en la BD.
        Requiere `devices:write`.
      tags:
        - Devices
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - protocol
              properties:
                protocol:
                  type: string
                  enum: [bacnet, mqtt]
                  description: Protocolo a escanear
                  example: bacnet
                timeout_s:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 5
                  description: Segundos de espera para respuestas
      responses:
        "200":
          description: Resultado del escaneo
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceScanResult"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /devices/{device_id}:
    get:
      operationId: get_device
      summary: Obtener dispositivo por ID
      description: Devuelve detalle del dispositivo. Requiere `devices:read`.
      tags:
        - Devices
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Datos del dispositivo
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Dispositivo no encontrado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: update_device
      summary: Actualizar configuración del dispositivo
      description: |
        Actualiza nombre, dirección, puerto, config o area.
        No permite cambiar `is_simulator` a `false` si el dispositivo es simulador
        (retorna 422). Requiere `devices:write`.
      tags:
        - Devices
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "200":
          description: Dispositivo actualizado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Dispositivo no encontrado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Intento de cambiar is_simulator=false en un simulador
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "No se puede cambiar is_simulator a false sin validación explícita"
                trace_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    delete:
      operationId: delete_device
      summary: Eliminar dispositivo
      description: |
        Elimina el dispositivo y todos sus puntos asociados (CASCADE).
        Si el dispositivo tiene el polling activo, el worker lo ignorará en la
        siguiente iteración. Requiere `config:write`.
      tags:
        - Configurator
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Dispositivo eliminado
        "401":
          description: No autenticado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin permiso suficiente
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Dispositivo no encontrado
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/XTraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /devices/{device_id}/points:
    get:
      operationId: list_device_points
      summary: Listar puntos de un dispositivo
      description: Devuelve todos los puntos configurados para el dispositivo. Requiere `points:read`.
      tags:
        - Devices
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
