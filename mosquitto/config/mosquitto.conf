# Hira — Mosquitto MQTT Broker
# Autenticación obligatoria: se rechazan conexiones anónimas (V-01)

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistencia
persistence true
persistence_location /mosquitto/data/

# Logs a stdout (requerido en Docker; file da problemas de permisos en volúmenes Windows)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
